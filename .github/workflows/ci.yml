name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build && python -m pip install -e .
      - name: Run all domain suites
        run: python scripts/test_all.py
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist
      - name: Verify wheel install
        run: |
          python -m venv /tmp/office-wheel
          cd /tmp
          /tmp/office-wheel/bin/python -m pip install --force-reinstall "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/office-wheel/bin/python -c "import importlib.metadata as m, importlib.resources as r; import office_artifact_tool, xlsx_artifact_tool, pptx_artifact_tool, pptx_ai_composer, office_application_witness; assert m.version('kwentin-office') == '0.3.0'; assert len([x for x in m.entry_points(group='console_scripts') if x.name.startswith('office-')]) == 5; assert r.files('office_artifact_tool').joinpath('resources/inventory.schema.json').is_file(); assert r.files('xlsx_artifact_tool').joinpath('resources/inventory.schema.json').is_file(); assert r.files('pptx_artifact_tool').joinpath('resources/inventory.schema.json').is_file()"
          /tmp/office-wheel/bin/office-docx --help >/tmp/office-docx.txt
          printf '{"action":"unsupported"}\n' | /tmp/office-wheel/bin/office-xlsx >/tmp/office-xlsx.json
          printf '{"action":"unsupported"}\n' | /tmp/office-wheel/bin/office-pptx-edit >/tmp/office-pptx-edit.json
          printf '{"action":"unsupported"}\n' | /tmp/office-wheel/bin/office-pptx-compose >/tmp/office-pptx-compose.json || test "$?" -eq 2
          printf '{}\n' | /tmp/office-wheel/bin/office-witness --workdir /tmp/office-witness-work --executable /bin/false >/tmp/office-witness.json || test "$?" -eq 2
          /tmp/office-wheel/bin/python -c "import json; paths=['/tmp/office-xlsx.json','/tmp/office-pptx-edit.json','/tmp/office-pptx-compose.json','/tmp/office-witness.json']; results=[json.load(open(path)) for path in paths]; assert all(result.get('status') in {'refused','error'} for result in results)"
